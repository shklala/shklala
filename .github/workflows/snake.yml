# Redraws the contribution graph as a snake and commits the result to the
# `output` branch, which the README points at. Runs every six hours, on every
# push to main, and on demand from the Actions tab.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#5CF2C4&color_dots=#0a0f1f,#1f2a4d,#4b3f9e,#8b7bff,#5cf2c4

      - name: Push it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
